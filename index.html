<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="./css/icons/logo.svg" alt="logo">
                <p>BREW & BEAN</p>
            </div>
            <ul>
                <li >Home</li>
                <li>Our Story</li>
                <li>Menu</li>
                <li>Contact</li>
            </ul>
            <div class="button">
                    <button class="btn">visit us</button>
                    <button class="menu"><img src="./css/icons/menu.svg" alt="menu"></button>
            </div>
           
        </div>
    </header>
    <main class="hero">
        <section class="text-section">
            <div class="container">
                <span class="tag">
                    <img src="./css/icons/fire.svg">
                        FRESHLY BREWED DAILY
                </span>
                <h1>Your Daily Dose of Happiness.</h1>
                <p>Savor the warmth of ethically sourced, masterfully roasted coffee</p>
            <div class="hero-button">
                <button class="first-child">Explore Our Menu </button>
                <button class="second-child"> Our Story</button>
            </div>
            </div>
            <div class="numbers">
                <div class="number">
                        <strong>15+</strong>
                        <span>Roast Varieties</span>
                </div>
                <div class="number">
                        <strong>100%</strong>
                        <span>Organic Certified</span>
                </div>
                <div class="number">
                        <strong>4.9</strong>
                        <span>Neighborhood Rating</span>
                </div>

            </div>
        </section>
<section class="photo-section">
    <div class="container">

        <div class="photo-wrapper">

            <div class="photo-bg">
                
            </div>

            <div class="photo-card">
                <img class="photo"
                     src="./css/imgs/latte.webp"alt="Latte">

                <div class="badge">
                    <div class="badge-icon">
                        <img src="./css/icons/Overlay.svg" alt="">
                    </div>

                    <div class="badge-text">
                        <strong>Micro-Roasted</strong>
                        <span>Crafted every sunrise</span>
                    </div>
                </div>

            </div>

        </div>

    </div>
</section>
